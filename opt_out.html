<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove My Business Listing (PDPA 2010 Opt-Out) | LeadHarvest</title>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #090d16; color: #f1f5f9; line-height: 1.5; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 14px 0; position: sticky; top: 0; z-index: 50; }
.nav-row { display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 1.25rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.logo span { color: #10b981; }
.badge-my { background: #064e3b; color: #34d399; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid #059669; }
.btn-primary { background: #10b981; color: #022c22; font-weight: 700; padding: 10px 18px; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary:hover { background: #34d399; }
.hero { padding: 48px 0 32px; text-align: center; background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 70%); border-bottom: 1px solid #1e293b; }
.pill { display: inline-block; background: #064e3b; color: #6ee7b7; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid #059669; margin-bottom: 16px; }
h1 { font-size: 2rem; font-weight: 900; line-height: 1.2; margin-bottom: 14px; color: #ffffff; }
@media(min-width: 768px) { h1 { font-size: 3rem; } }
.hero p { font-size: 1rem; color: #94a3b8; max-width: 700px; margin: 0 auto 24px; }
.card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 20px; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
@media(min-width: 640px) { .form-grid { grid-template-columns: 1.2fr 1.2fr 1fr; } }
select, input { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none; }
select:focus, input:focus { border-color: #10b981; }
.table-wrap { overflow-x: auto; background: #0b1120; border-radius: 10px; border: 1px solid #1e293b; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
th { background: #020617; color: #94a3b8; padding: 10px 14px; font-weight: 600; border-bottom: 1px solid #1e293b; text-transform: uppercase; font-size: 11px; }
td { padding: 12px 14px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
.wa-link { color: #34d399; background: #064e3b; padding: 3px 8px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.rating { color: #f59e0b; font-weight: 700; font-size: 12px; }
.pricing-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin: 32px 0; }
@media(min-width: 640px) { .pricing-grid { grid-template-columns: 1fr 1fr; } }
.price-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.price-card.featured { border: 2px solid #10b981; box-shadow: 0 0 20px rgba(16,185,129,0.15); }
.badge-pop { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #10b981; color: #022c22; font-size: 10px; font-weight: 800; padding: 2px 10px; border-radius: 20px; text-transform: uppercase; }
.price-val { font-size: 2.2rem; font-weight: 900; color: #fff; margin: 12px 0; }
.checklist { list-style: none; margin-bottom: 24px; font-size: 13px; color: #cbd5e1; }
.checklist li { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.checklist li span { color: #10b981; font-weight: bold; }
footer { background: #020617; border-top: 1px solid #1e293b; padding: 28px 0; font-size: 12px; color: #64748b; }
.footer-row { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
@media(min-width: 640px) { .footer-row { flex-direction: row; justify-content: space-between; text-align: left; } }
.footer-links a { color: #94a3b8; text-decoration: none; margin-left: 14px; }
.footer-links a:hover { color: #10b981; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: #0f172a; border: 1px solid #334155; border-radius: 14px; max-width: 440px; width: 100%; padding: 24px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
.close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
.hidden { display: none !important; }
</style>
</head>
<body>
    <header>
        <div class="container nav-row">
            <a href="index.html" class="logo">⚡ Lead<span>Harvest</span></a>
            <a href="index.html" style="color: #94a3b8; font-size: 13px; text-decoration: none;">← Back to Home</a>
        </div>
    </header>
    <main class="container" style="max-width: 600px; padding: 48px 16px;">
        <div class="card">
            <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Business Listing Removal Request</h1>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">
                In strict compliance with Malaysia's <strong>Personal Data Protection Act 2010 (PDPA)</strong>, any Malaysian business owner or representative may request immediate delisting of their public commercial listing from our index.
            </p>
            <form onsubmit="event.preventDefault(); alert('Request submitted! Your business record will be permanently purged within 24 hours.');">
                <div style="margin-bottom: 14px;">
                    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Registered Business / Company Name</label>
                    <input type="text" required placeholder="e.g. Kedai Kopi ABC Sdn Bhd">
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Phone Number to Delist</label>
                    <input type="tel" required placeholder="e.g. +6012-3456789">
                </div>
                <div style="margin-bottom: 18px;">
                    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Reason for Removal (Optional)</label>
                    <select>
                        <option>Ceased commercial operations</option>
                        <option>Do not want B2B inquiries</option>
                        <option>Incorrect phone number listed</option>
                        <option>Other</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Submit Delisting Request</button>
            </form>
        </div>
    </main>
</body>
</html>
